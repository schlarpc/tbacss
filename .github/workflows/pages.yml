name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    # Nothing to deploy until scripts/release_data.sh has pinned a bundle.
    if: hashFiles('web/data-release.json') != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2
      - uses: DeterminateSystems/nix-installer-action@v22
      - uses: DeterminateSystems/magic-nix-cache-action@v13
      # The viewer, plus the data bundle fetched from the release that
      # web/data-release.json pins by hash.
      - run: nix build .#site --print-build-logs
      # nix build gives a symlink into a read-only store path, and the data
      # files are themselves symlinks; Pages needs a real directory tree.
      - run: cp -rL result _site && chmod -R u+w _site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
