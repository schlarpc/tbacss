version: 2
updates:
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
  - package-ecosystem: "nix"
    directory: "/"
    schedule:
      interval: "weekly"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    ignore:
      # Tracks the Node major nixpkgs ships, not the newest one.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # svelte-check needs the TypeScript API, which TypeScript 7 no longer has.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
