<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Rank, compare and listen to every suppressor tested at the TBAC Silencer Summits, 2023–2026.">
<title>Silencer Summit explorer</title>
<script>
  // Theme before first paint, so a dark-mode reader never sees a paper flash.
  // ?theme= wins over the stored choice, which wins over the OS.
  (() => {
    let theme = new URLSearchParams(location.search).get('theme');
    try { theme ??= localStorage.getItem('tbacss-theme'); } catch {}
    if (theme === 'light' || theme === 'dark') document.documentElement.dataset.theme = theme;
  })();
</script>
</head>
<body>
<div id="app"></div>
<script type="module" src="/src/main.ts"></script>
</body>
</html>
